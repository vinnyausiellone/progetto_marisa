<div class="es-container"[class.dark-mode]="sharedService.toggle">
    <div class="input-container">
        <h5>Gioca in modo personalizzato</h5>
        <p> Carica 8 foto:</p>
        <input class="inputFile" id="my-file-input" style="display: none;" type="file" accept="image/*" (change)="onFileChange($event)" multiple />
        <label class="inputLabel" for="my-file-input">Scegli foto</label>
    </div>
    <div *ngIf="sharedService.arrayFotoBackup" class="mt-20">
        <div class="custom-title" *ngFor="let item of sharedService.arrayFotoBackup">{{item.name}}</div>
    </div>
    <div>
        <button class="button-standard" (click)="onUpload()">GIOCA ORA</button>
        <button class="button-standard ml-10" (click)="onReset()">Resetta foto</button>
    </div>
</div>
