<div *ngIf="!isFromLista">
<h4>{{ 'Ricetta: ' + pageTitle }}</h4>
<div class="d-flex flex-direction-column">
  <mat-form-field class="custum-textarea">
    <textarea matInput placeholder="Ricetta" [formControl]="ricettaFC"></textarea>
  </mat-form-field>
  <span class="mt-5" *ngIf="valoreRicetta">{{valoreRicetta}}</span>
</div>

<button class="salvaRicetta" (click)="onSalvaRicetta()"> Salva Ricetta</button>
</div>
