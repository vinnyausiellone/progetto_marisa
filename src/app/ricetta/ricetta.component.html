<div class="es-container">
  <div *ngIf="!isFromLista">
    <div class="custom-title justify-content-between d-flex a-i-c p-20">
      <h4 class="custom-title">{{ 'Ricetta: ' + pageTitle }}</h4>
      <button class="button-standard h-45" (click)="bottoneIndietro()">INDIETRO</button>
    </div>
    <span class="mt-5" *ngIf="valoreRicetta">{{valoreRicetta}}</span>
    <div class="d-flex flex-direction-column">
      <mat-form-field class="custum-textarea">
        <textarea matInput placeholder="Modifica ricetta" [formControl]="ricettaFC"></textarea>
      </mat-form-field>
    </div>

    <button class="button-standard mr-5 salvaBottone" (click)="onSalvaRicetta()"> Salva Ricetta</button>
  </div>
</div>
